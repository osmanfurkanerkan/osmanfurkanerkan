name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: osmanfurkanerkan
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push output
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          cd dist
          git init
          git add .
          git commit -m "update snake"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/osmanfurkanerkan/osmanfurkanerkan.git HEAD:output